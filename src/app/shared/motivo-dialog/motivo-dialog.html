<h2 mat-dialog-title>{{ data.titulo }}</h2>
<mat-dialog-content>
    <mat-form-field appearance="outline" class="campo">
        <mat-label>{{ data.etiqueta }}</mat-label>
        <textarea matInput rows="3" maxlength="255" [formControl]="motivo"></textarea>
    </mat-form-field>
</mat-dialog-content>
<mat-dialog-actions align="end">
    <button mat-button mat-dialog-close>Cancelar</button>
    <button mat-flat-button [disabled]="motivo.invalid" (click)="aceptar()">{{ data.confirmar ?? 'Aceptar' }}</button>
</mat-dialog-actions>
