<h2 mat-dialog-title>Agregar involucrado</h2>
<mat-dialog-content>
    <form [formGroup]="form" class="col">
        <mat-form-field appearance="outline">
            <mat-label>Buscar estudiante</mat-label>
            <input matInput formControlName="estudiante" [matAutocomplete]="auto" />
            <mat-autocomplete #auto="matAutocomplete" [displayWith]="mostrar"
                (optionSelected)="seleccionado = $event.option.value">
                @for (e of resultados(); track e.id) {
                <mat-option [value]="e">{{ e.apellidos }}, {{ e.nombres }} · {{ e.grado }} {{ e.seccion }}</mat-option>
                }
            </mat-autocomplete>
            <mat-hint>Escribe al menos 2 letras del nombre o el código SIAGIE</mat-hint>
        </mat-form-field>

        <mat-form-field appearance="outline">
            <mat-label>Rol en el hecho</mat-label>
            <mat-select formControlName="rolInvolucrado">
                <mat-option value="VICTIMA">Víctima</mat-option>
                <mat-option value="AGRESOR">Agresor</mat-option>
                <mat-option value="TESTIGO">Testigo</mat-option>
            </mat-select>
        </mat-form-field>

        <mat-form-field appearance="outline">
            <mat-label>Observaciones (opcional)</mat-label>
            <textarea matInput rows="2" maxlength="255" formControlName="observaciones"></textarea>
        </mat-form-field>
    </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
    <button mat-button mat-dialog-close>Cancelar</button>
    <button mat-flat-button [disabled]="!seleccionado" (click)="guardar()">Agregar</button>
</mat-dialog-actions>
