<div class="wrap">
  <mat-card class="card">
    <img class="logo" src="img/logo.png" alt="Logo SIGECE" />
    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="entrar()">
        <mat-form-field appearance="outline">
          <mat-label>Usuario</mat-label>
          <input matInput formControlName="username" autocomplete="username" />
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Contraseña</mat-label>
          <input matInput [type]="ver() ? 'text' : 'password'" formControlName="password" autocomplete="current-password" />
          <button mat-icon-button matSuffix type="button" (click)="ver.set(!ver())">
            <mat-icon>{{ ver() ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
        </mat-form-field>
        @if (error()) { <p class="error">{{ error() }}</p> }
        <button mat-flat-button type="submit" [disabled]="form.invalid || cargando()">Iniciar sesión</button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
