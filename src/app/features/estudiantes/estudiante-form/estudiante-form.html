<h2 mat-dialog-title>{{ datos ? 'Editar estudiante' : 'Nuevo estudiante' }}</h2>
<mat-dialog-content>
  <form [formGroup]="form" class="grid">
    <mat-form-field appearance="outline" class="full">
      <mat-label>Código SIAGIE</mat-label>
      <input matInput formControlName="codigoSiagie" />
      @if (form.controls.codigoSiagie.hasError('required')) { <mat-error>Requerido</mat-error> }
    </mat-form-field>
    <mat-form-field appearance="outline"><mat-label>Nombres</mat-label><input matInput
        formControlName="nombres" /><mat-error>Requerido</mat-error></mat-form-field>
    <mat-form-field appearance="outline"><mat-label>Apellidos</mat-label><input matInput
        formControlName="apellidos" /><mat-error>Requerido</mat-error></mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Fecha de nacimiento</mat-label>
      <input matInput type="date" formControlName="fechaNacimiento" [max]="maxFecha" />
      <mat-error>Requerida</mat-error>
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Nivel</mat-label>
      <mat-select formControlName="nivel">
        @for (n of niveles; track n) { <mat-option [value]="n">{{ n }}</mat-option> }
      </mat-select>
      <mat-error>Requerido</mat-error>
    </mat-form-field>
    <mat-form-field appearance="outline"><mat-label>Grado</mat-label><input matInput
        formControlName="grado" /><mat-error>Requerido</mat-error></mat-form-field>
    <mat-form-field appearance="outline"><mat-label>Sección</mat-label><input matInput
        formControlName="seccion" /><mat-error>Requerida</mat-error></mat-form-field>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Cancelar</button>
  <button mat-flat-button (click)="guardar()" [disabled]="guardando()">Guardar</button>
</mat-dialog-actions>
